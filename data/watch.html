<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching - Anichin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-[#121212] text-gray-300 font-sans">

    <header class="bg-[#1a1a1a] p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="../index.html" class="text-white text-2xl">
                 <i class="fa-solid fa-house"></i>
            </a>
            <a href="../index.html">
                <img src="https://anichin.moe/wp-content/uploads/2023/10/anichin-logo-text-v4-min.png" alt="Anichin Logo" class="h-10 object-contain">
            </a>
            <button class="text-white text-xl">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
    </header>

    <main class="container mx-auto p-4 md:p-8">
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Video Player & Title -->
            <div class="lg:w-3/4">
                <div id="player-container" class="bg-black rounded-lg overflow-hidden mb-4">
                     <div class="w-full aspect-video flex items-center justify-center">
                        <p class="text-gray-400">Loading video player...</p>
                    </div>
                </div>
                <div id="title-container" class="bg-[#1a1a1a] p-4 rounded-lg">
                    <!-- Title will be loaded here -->
                </div>
            </div>
            <!-- Episode List -->
            <div class="lg:w-1/4">
                <div class="bg-[#1a1a1a] p-4 rounded-lg">
                     <h2 class="text-xl font-bold text-white mb-4">Episodes</h2>
                     <ul id="episode-list-container" class="space-y-2 max-h-[60vh] overflow-y-auto pr-2">
                        <p class="text-gray-500">Loading episodes...</p>
                     </ul>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="bg-[#1a1a1a] p-4 mt-8 border-t border-gray-700">
        <div class="container mx-auto text-center text-gray-400 text-sm">
            <p>&copy; 2024 ANICHIN.CARE. All rights reserved.</p>
            <p class="mt-2">Disclaimer: This site does not store any files on its server. All contents are provided by non-affiliated third parties.</p>
        </div>
    </footer>

    <script src="watch.js"></script>
</body>
</html>
