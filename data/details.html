<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donghua动画 - Nonton Donghua Sub Indo Gratis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link id="favicon" rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="manifest" href="manifest.json">
    <style>
        .tab-btn.active {
            color: white;
            border-color: #ef4444; /* red-500 */
        }
    </style>
</head>
<body class="bg-[#121212] text-gray-300 font-sans">

    <header class="bg-[#1a1a1a] p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="../index.html" class="text-white text-2xl">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <a href="../index.html" class="text-2xl font-bold tracking-wider">
                <span id="header-title" class="text-white">Donghua</span><span id="header-subtitle" class="text-red-500">动画</span>
            </a>
            <button id="search-btn" class="text-white text-xl">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
    </header>

    <main class="container mx-auto p-4 md:p-8">
        <div id="content-area">
            <p class="text-center text-gray-400">Loading details...</p>
        </div>
    </main>
    
    <footer class="bg-[#1a1a1a] p-4 mt-8 border-t border-gray-700">
        <div class="container mx-auto text-center text-gray-400 text-sm">
            <p id="footer-copyright">&copy; 2024 Donghua动画. All rights reserved.</p>
            <p id="footer-disclaimer" class="mt-2">Disclaimer: This site does not store any files on its server. All contents are provided by non-affiliated third parties.</p>
        </div>
    </footer>

    <!-- Search Modal -->
    <div id="search-modal" class="fixed inset-0 bg-black bg-opacity-80 z-[100] hidden items-start justify-center pt-20">
        <div id="search-modal-content" class="bg-[#1a1a1a] w-full max-w-2xl rounded-lg shadow-xl relative">
            <button id="close-search-btn" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl">&times;</button>
            <div class="p-6">
                <input type="text" id="search-input" placeholder="Search for Donghua..." class="w-full bg-[#2a2a2a] border border-gray-600 rounded-md py-3 px-4 text-white focus:outline-none focus:ring-2 focus:ring-red-500">
                <div id="search-results" class="mt-4 max-h-[60vh] overflow-y-auto">
                    <!-- Results will appear here -->
                </div>
            </div>
        </div>
    </div>

    <script src="details.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
