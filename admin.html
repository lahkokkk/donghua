<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Anichin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-[#121212] text-gray-300 font-sans">

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
        <div class="bg-[#1a1a1a] p-8 rounded-lg shadow-xl w-full max-w-sm">
            <h2 class="text-2xl font-bold text-white text-center mb-6">Admin Login</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-400">Email</label>
                    <input type="email" id="email" name="email" class="mt-1 block w-full bg-[#2a2a2a] border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-red-500 focus:border-red-500" required>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-400">Password</label>
                    <input type="password" id="password" name="password" class="mt-1 block w-full bg-[#2a2a2a] border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-red-500 focus:border-red-500" required>
                </div>
                <div>
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 focus:ring-offset-gray-800">
                        Login
                    </button>
                </div>
                <p id="login-error" class="text-red-500 text-sm text-center h-4"></p>
            </form>
        </div>
    </div>

    <!-- Main Content (Initially Hidden) -->
    <div id="main-content" class="hidden">
        <header class="bg-[#1a1a1a] p-4 shadow-md">
            <div class="container mx-auto">
                <h1 class="text-white text-2xl font-bold">Anichin Content Management</h1>
            </div>
        </header>

        <main class="container mx-auto p-4 md:p-8">
            <div class="bg-[#1a1a1a] p-6 rounded-lg shadow-lg">
                <h2 class="text-xl font-bold text-white mb-6">Add/Update Content</h2>
                
                <form id="content-form" class="space-y-4">
                    <!-- Standard Fields -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="title" class="block text-sm font-medium text-gray-400">Title</label>
                            <input type="text" id="title" name="title" class="mt-1 block w-full bg-[#2a2a2a] border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-red-500 focus:border-red-500" required>
                        </div>
                        <div>
                            <label for="imageUrl" class="block text-sm font-medium text-gray-400">Image URL</label>
                            <input type="url" id="imageUrl" name="imageUrl" class="mt-1 block w-full bg-[#2a2a2a] border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-red-500 focus:border-red-500" required>
                        </div>
                         <div>
                            <label for="episode" class="block text-sm font-medium text-gray-400">Latest Episode (Card display)</label>
                            <input type="text" id="episode" name="episode" class="mt-1 block w-full bg-[#2a2a2a] border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-red-500 focus:border-red-500">
                        </div>
                        <div>
                            <label for="type" class="block text-sm font-medium text-gray-400">Type</label>
                            <select id="type" name="type" class="mt-1 block w-full bg-[#2a2a2a] border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-red-500 focus:border-red-500">
                                <option>Donghua</option>
                                <option>Movie</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label for="synopsis" class="block text-sm font-medium text-gray-400">Synopsis</label>
                        <textarea id="synopsis" name="synopsis" rows="4" class="mt-1 block w-full bg-[#2a2a2a] border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-red-500 focus:border-red-500"></textarea>
                    </div>

                    <!-- Episode Management -->
                    <div>
                         <label class="block text-sm font-medium text-gray-400">Episode Management</label>
                         <div id="episodes-container" class="mt-2 space-y-2"></div>
                         <button type="button" id="add-episode-btn" class="mt-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-1 px-3 rounded">+ Add Episode</button>
                    </div>

                    <!-- Sections & Flags -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-400">Sections</label>
                            <div id="section-checkboxes" class="mt-2 space-y-2">
                                <div class="flex items-center"><input id="section-popularToday" name="section" type="checkbox" value="popularToday" class="h-4 w-4 text-red-600 bg-gray-700 border-gray-600 rounded focus:ring-red-500"><label for="section-popularToday" class="ml-2 block text-sm text-gray-300">Popular Today</label></div>
                                <div class="flex items-center"><input id="section-latestRelease" name="section" type="checkbox" value="latestRelease" class="h-4 w-4 text-red-600 bg-gray-700 border-gray-600 rounded focus:ring-red-500"><label for="section-latestRelease" class="ml-2 block text-sm text-gray-300">Latest Release</label></div>
                                <div class="flex items-center"><input id="section-movies" name="section" type="checkbox" value="movies" class="h-4 w-4 text-red-600 bg-gray-700 border-gray-600 rounded focus:ring-red-500"><label for="section-movies" class="ml-2 block text-sm text-gray-300">Movies</label></div>
                                <div class="flex items-center"><input id="section-upcoming" name="section" type="checkbox" value="upcoming" class="h-4 w-4 text-red-600 bg-gray-700 border-gray-600 rounded focus:ring-red-500"><label for="section-upcoming" class="ml-2 block text-sm text-gray-300">Upcoming Donghua</label></div>
                                <div class="flex items-center"><input id="section-dropped" name="section" type="checkbox" value="dropped" class="h-4 w-4 text-red-600 bg-gray-700 border-gray-600 rounded focus:ring-red-500"><label for="section-dropped" class="ml-2 block text-sm text-gray-300">Dropped Project</label></div>
                                <div class="flex items-center"><input id="section-slider" name="section" type="checkbox" value="slider" class="h-4 w-4 text-red-600 bg-gray-700 border-gray-600 rounded focus:ring-red-500"><label for="section-slider" class="ml-2 block text-sm text-gray-300">Slider</label></div>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-400">Flags</label>
                            <div class="mt-2 space-y-2">
                                <div class="flex items-center"><input id="subbed" name="subbed" type="checkbox" class="h-4 w-4 text-red-600 bg-gray-700 border-gray-600 rounded focus:ring-red-500"><label for="subbed" class="ml-2 block text-sm text-gray-300">Subbed</label></div>
                                <div class="flex items-center"><input id="ongoing" name="ongoing" type="checkbox" class="h-4 w-4 text-red-600 bg-gray-700 border-gray-600 rounded focus:ring-red-500"><label for="ongoing" class="ml-2 block text-sm text-gray-300">Ongoing (Clock Icon)</label></div>
                            </div>
                        </div>
                    </div>

                    <div>
                        <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 focus:ring-offset-gray-800">
                            Add Content
                        </button>
                    </div>
                </form>
            </div>

            <div class="bg-[#1a1a1a] p-6 rounded-lg shadow-lg mt-8">
                <h2 class="text-xl font-bold text-white mb-6">Current Content</h2>
                <div id="current-content-container">
                    <!-- Content will be dynamically loaded here by admin.js -->
                </div>
            </div>
        </main>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
