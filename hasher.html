<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credential JSON Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#121212] text-gray-300 font-sans flex items-center justify-center min-h-screen">

    <div class="bg-[#1a1a1a] p-8 rounded-lg shadow-xl w-full max-w-md">
        <h1 class="text-2xl font-bold text-white text-center mb-6">Credential JSON Generator</h1>
        <div class="space-y-4">
             <div>
                <label for="email" class="block text-sm font-medium text-gray-400">Email</label>
                <input type="email" id="email" name="email" class="mt-1 block w-full bg-[#2a2a2a] border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-red-500 focus:border-red-500" required>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-400">Password</label>
                <input type="password" id="password" name="password" class="mt-1 block w-full bg-[#2a2a2a] border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-red-500 focus:border-red-500" required>
            </div>

            <div>
                <button id="generate-json" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 focus:ring-offset-gray-800">
                    Generate JSON
                </button>
            </div>

            <div class="pt-4">
                <label class="block text-sm font-medium text-gray-400">Generated JSON:</label>
                <pre id="json-output" class="mt-1 block w-full bg-[#2a2a2a] border border-gray-600 rounded-md p-3 text-white whitespace-pre-wrap break-all min-h-[10rem]"></pre>
            </div>
        </div>
    </div>

    <script src="js/hasher.js"></script>
</body>
</html>
